<svg width="360" height="90" viewBox="0 0 360 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueBookGrad" x1="15" y1="20" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1E40AF" />
      <stop offset="1" stopColor="#1E3A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="60" y1="20" x2="105" y2="90" gradientUnits="userSpaceOnUse">
      <stop stopColor="#F59E0B" />
      <stop offset="1" stopColor="#D97706" />
    </linearGradient>
    <linearGradient id="scaleBlueGrad" x1="30" y1="35" x2="55" y2="65" gradientUnits="userSpaceOnUse">
      <stop stopColor="#2563EB" />
      <stop offset="1" stopColor="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Group Icon (scaled & positioned) -->
  <g transform="translate(10, 5) scale(0.66)">
    <!-- Left Book Layer (Blue) -->
    <path d="M60 84C45 81 26 84 15 88V34C26 30 45 28 60 32V84Z" fill="url(#blueBookGrad)" />
    <path d="M60 84C45 81 26 84 15 88" stroke="#172554" stroke-width="3" stroke-linecap="round" />
    <path d="M20 93C30 90 45 88 60 90" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Book Layer (Gold) -->
    <path d="M60 84C75 81 94 84 105 88V34C94 30 75 28 60 32V84Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <path d="M60 90C75 88 90 90 100 93" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Book Center Spine -->
    <path d="M60 22V86" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" />
    <polygon points="60,18 56,26 64,26" fill="#1E3A8A" />

    <!-- Scales of Justice -->
    <path d="M32 40C42 36 50 36 60 38C70 36 78 36 88 40" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="60" cy="38" r="3.5" fill="#D97706" />

    <line x1="32" y1="40" x2="25" y2="56" stroke="#2563EB" stroke-width="2" />
    <line x1="32" y1="40" x2="39" y2="56" stroke="#2563EB" stroke-width="2" />
    <path d="M23 56C23 63 39 63 41 56H23Z" fill="url(#scaleBlueGrad)" />

    <line x1="88" y1="40" x2="81" y2="56" stroke="#D97706" stroke-width="2" />
    <line x1="88" y1="40" x2="95" y2="56" stroke="#D97706" stroke-width="2" />
    <path d="M79 56C79 63 95 63 97 56H79Z" fill="url(#goldGrad)" />

    <!-- Circuit Nodes -->
    <path d="M30 92L20 102H14" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="12" cy="102" r="3" fill="#0284C7" />
    <path d="M44 91L34 105H26" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="105" r="3" fill="#1E40AF" />
    <path d="M56 93L48 109H42" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="109" r="2.5" fill="#D97706" />
  </g>

  <!-- Typography -->
  <text x="100" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#1D4ED8" letter-spacing="-0.5">PACO</text>
  <text x="190" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#0F172A" letter-spacing="-0.5">LegalBook</text>
  <text x="102" y="65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="1.5">THƯ VIỆN PHÁP LUẬT SỐ</text>
</svg>
